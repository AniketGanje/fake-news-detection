<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fake News Detector</title>
<style>
body{font-family:Arial;text-align:center;padding:20px;background:#f2f2f2}
.box{background:white;padding:20px;border-radius:10px;max-width:500px;margin:auto}
textarea{width:95%;height:120px;padding:10px}
button{padding:10px 20px;background:#007bff;color:white;border:none;border-radius:5px;margin-top:10px}
.result{margin-top:20px;font-size:20px;font-weight:bold}
</style>
</head>
<body>
<div class="box">
<h2>Fake News Detection</h2>
<form method="POST">
<textarea name="news" placeholder="News paste kara..."></textarea><br>
<button type="submit">Check</button>
</form>
{% if prediction %}
<div class="result">{{ prediction }}</div>
{% endif %}
</div>
</body>
</html>
